name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------
  # 1. TEST
  # 1. TEST (Backend Pytest + Frontend Lint & Build)
  # ---------------------------------------
  test:
    runs-on: ubuntu-latest

    # MongoDB service for tests
    # MongoDB service container for backend tests
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Backend Checks ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run tests
      - name: Run backend tests
        working-directory: ./backend
        env:
          MONGO_URL: mongodb://localhost:27017
          JWT_SECRET: ci-test-secret
        run: pytest test_main.py -v

      # --- Frontend Checks ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint

      - name: Test frontend production build
        working-directory: ./frontend
        run: npm run build


  # ---------------------------------------
  # 2. BUILD + PUSH (Docker images -> AWS ECR)
  # ---------------------------------------
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/devops-backend:latest
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devops-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/devops-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ steps.login-ecr.outputs.registry }}/devops-frontend:latest
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devops-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/devops-frontend:${{ github.sha }}


  # ---------------------------------------
  # 3. DEPLOY (SSH into EC2, pull latest images, restart containers)
  # 3. DEPLOY (SSH into EC2, pull latest images, restart containers, smoke test)
  # ---------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy nginx config to EC2
      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "nginx/nginx.conf,docker-compose.prod.yml"
          source: "nginx/nginx.conf,docker-compose.prod.yml,cloudwatch/cloudwatch-config.json"
          target: "~/devops_project"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export DOMAIN=${{ secrets.DOMAIN }}
            export MONGO_URL="${{ secrets.MONGO_URL }}"
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export SES_SENDER_EMAIL=${{ secrets.SES_SENDER_EMAIL }}
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            cd ~/devops_project

            # Login to ECR on the server
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Start/update all services
            docker compose -f docker-compose.prod.yml up -d

            # Reload nginx config without downtime
            # Reload nginx config gracefully
            docker exec devops-nginx nginx -s reload || true

            echo "✅ Deployment complete!"
            # Smoke test / health check verification
            sleep 8
            if docker exec devops-backend curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Health check passed: Backend is running and healthy!"
            else
              echo "⚠️ Warning: Backend healthcheck failed after deployment!"
            fi

            echo "🚀 Deployment completed successfully!"