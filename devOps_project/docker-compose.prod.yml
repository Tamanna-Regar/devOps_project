# PRODUCTION - runs on the AWS EC2 server, pulls pre-built images from Docker Hub
# ✅ MongoDB Atlas (cloud) use hota hai - no local MongoDB container needed

services:

  # ── FastAPI Backend ──
  backend:
    image: ${ECR_REGISTRY}/devops-backend:latest
    container_name: devops-backend
    restart: unless-stopped
    # Port 8000 NOT exposed to internet - Nginx handles it internally
    environment:
      - MONGO_URL=${MONGO_URL}        # MongoDB Atlas connection string
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=https://${DOMAIN:-localhost},https://www.${DOMAIN:-localhost}
      - AWS_REGION=${AWS_REGION}
      - SES_SENDER_EMAIL=${SES_SENDER_EMAIL}
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - /var/log/devops:/var/log/devops
    networks:
      - devops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── React Frontend ──
  frontend:
    image: ${ECR_REGISTRY}/devops-frontend:latest
    container_name: devops-frontend
    restart: unless-stopped
    # Port NOT exposed to internet - Nginx proxies to it
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devops-net

  # ── Nginx Reverse Proxy (SSL Termination) ──
  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP (redirects to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - /var/log/devops:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - devops-net

  # ── Certbot (SSL Certificate Manager) ──
  certbot:
    image: certbot/certbot
    container_name: devops-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Auto-renew certificate every 12 hours (Let's Encrypt expires every 90 days)
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  certbot_www:
  certbot_conf:

networks:
  devops-net:
    driver: bridge