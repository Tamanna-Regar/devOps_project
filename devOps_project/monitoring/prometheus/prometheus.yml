global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. DevOps Task Manager Backend API Metrics
  - job_name: "devops-backend"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000"]
        labels:
          application: "devops-taskmanager"
          environment: "production"

  # 3. System & Server Metrics (Node Exporter)
  - job_name: "node-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: "host-metrics"
