# ================================================================
# nginx/nginx.http.conf
# Used ONLY for first-time Certbot challenge (HTTP only, no SSL)
# After cert is issued, switch to nginx.conf
# ================================================================

server {
    listen 80;
    server_name _;

    # Certbot ACME challenge - Let's Encrypt uses this to verify domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporarily serve app on HTTP (before cert is ready)
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
